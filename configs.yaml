defaults:

  seed: 0
  batch_size: 32
  batch_length: 64

  jax:
    platform: cuda
    compute_dtype: float32
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 1e-4, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 512, hidden: 512, stoch: 32, classes: 16, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 512, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 512, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 2, units: 512, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 2, units: 512, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

  train_sac_wm:

    general:
      env_name: cube-single-play-singletask-v0
      wm_ckpt: ''
      seed_from_offline: True
      num_seed_steps: 4000
      num_train_steps: 500000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 10
      out_dir: train_sac_wm_out
      wandb_project: world-model-sac
      wandb_mode: online

    dreamer:
      train_every: 1
      max_episodes: 2000

    sac:
      train_every: 5
      horizon: 15
      imagination_batch: 1024
      gamma: 0.99
      lam: 0.95
      reward_shift: 1.0
      lr: 3e-4
      feature_dim: 512
      hidden_dim: 256
      critic_target_tau: 0.005
      init_ent_coef: 1.0

  # Baseline arm. Keep every value below that also appears under
  # train_sac_wm.sac IDENTICAL to it -- gamma, reward_shift, lr, feature_dim,
  # hidden_dim, critic_target_tau, init_ent_coef are shared by design and the
  # comparison stops being controlled the moment one side is tuned alone.
  # train_every and batch_size are the exceptions: those are legitimately
  # method-specific and sit here at their standard SAC values.
  train_sac:

    general:
      env_name: cube-single-play-singletask-v0
      seed_from_offline: True
      num_seed_steps: 4000
      num_train_steps: 500000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 10
      out_dir: train_sac_out
      wandb_project: world-model-sac
      wandb_mode: online

    sac:
      train_every: 1
      batch_size: 256
      replay_capacity: 1000000
      gamma: 0.99
      reward_shift: 1.0
      lr: 3e-4
      feature_dim: 512
      hidden_dim: 256
      critic_target_tau: 0.005
      init_ent_coef: 1.0

  # ---------------------------------------------------------------------
  # Action-chunked arms. Same rule as above: every key that appears in BOTH
  # train_sac_chunked_wm.chunk and train_sac_chunked.chunk must hold the same
  # value. chunk_len, ensemble, bc_alpha, flow_steps and normalize_q define
  # the policy, and the policy is the controlled variable -- the only thing
  # that is allowed to differ between the two arms is whether a world model
  # exists. train_every, batch_size and imagination_batch are the exceptions,
  # since the two arms genuinely draw their training data differently.
  # ---------------------------------------------------------------------

  train_sac_chunked_wm:

    general:
      env_name: cube-double-play-singletask-v0
      wm_ckpt: ''
      seed_from_offline: True
      num_seed_steps: 4000
      num_train_steps: 500000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 20
      out_dir: train_sac_chunked_wm_out
      wandb_project: world-model-chunk
      wandb_mode: online

    dreamer:
      train_every: 1
      max_episodes: 2000

    chunk:
      chunk_len: 5
      # chunk_len * num_chunks = 15 imagined environment steps, the same depth
      # the single-step run was verified at. Raising num_chunks to 15 would
      # ask the model to hallucinate 75 steps ahead.
      num_chunks: 3
      # 4x the single-step imagination_batch, to partly offset getting 3
      # critic examples per rollout instead of 15. Drop this first if the
      # rollout becomes the bottleneck.
      imagination_batch: 4096
      train_every: 5
      gamma: 0.99
      lam: 0.95
      reward_shift: 1.0
      lr: 3e-4
      feature_dim: 512
      hidden_dim: 256
      critic_target_tau: 0.005
      ensemble: 10
      # QC-FQL's behavior regularization coefficient for the cube domains.
      # This is THE hyperparameter of the method: too low and the chunk
      # collapses to open-loop noise, too high and the critic cannot improve
      # on the demonstrations. Sweep {100, 300, 1000} before anything else.
      bc_alpha: 300.0
      bc_batch: 1024
      flow_steps: 10
      normalize_q: True
      # Slice of the observation holding end-effector xyz, used for the
      # temporal-coherence metric. VERIFY THIS against the actual OGBench
      # observation layout before trusting the coherence numbers -- a wrong
      # slice produces a plausible-looking but meaningless curve.
      eef_slice: [0, 3]

  train_sac_chunked:

    general:
      env_name: cube-double-play-singletask-v0
      seed_from_offline: True
      num_seed_steps: 4000
      num_train_steps: 500000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 20
      out_dir: train_sac_chunked_out
      wandb_project: world-model-chunk
      wandb_mode: online

    chunk:
      chunk_len: 5
      train_every: 1
      batch_size: 256
      replay_capacity: 1000000
      gamma: 0.99
      reward_shift: 1.0
      lr: 3e-4
      feature_dim: 512
      hidden_dim: 256
      critic_target_tau: 0.005
      ensemble: 10
      bc_alpha: 300.0
      flow_steps: 10
      normalize_q: True
      eef_slice: [0, 3]
