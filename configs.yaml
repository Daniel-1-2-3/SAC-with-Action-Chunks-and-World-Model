defaults:
  seed: 0
train_sear:
  train_sear:
    env_name: cube-double-play-singletask-v0
    out_dir: sear_runs
    wandb_project: sear-p2e
    wandb_mode: online
    chunk_len: 5
    gamma: 0.99
    num_online_steps: 1000000
    num_seed_steps: 4000
    start_training: 5000
    max_episode_steps: 500
    max_episodes: 2000
    seq_len: 48
    batch_size: 256
    wm_batch: 16
    wm_every: 2
    wm_lr: 0.0001
    wm_compile: true
    use_world_model: true
    ensemble_k: 5
    ensemble_obs_slice:
    - 19
    - 37
    imagine_horizon: 5
    explore_every: 2
    imagine_batch: 256
    critic_vmin: -260.0
    critic_vmax: 10.0
    eval_receding: 5
    eval_episodes: 20
    eval_max_steps: 500
    eef_slice:
    - 12
    - 15
    explore_frac: 1.0
    reward_batch_frac: 0.15
    alpha_min: 0.001
    explore_reward_mix: 0.3
    owm_alpha: 0.0
    owm_eta: 0.001
    success_reward_thresh: -1.5
    log_every: 500
    eval_every: 10000
    save_every: 50000