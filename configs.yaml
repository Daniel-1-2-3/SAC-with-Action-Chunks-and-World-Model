defaults:
  seed: 0
train_sear:
  train_sear:
    env_name: cube-double-play-singletask-v0
    out_dir: sear_runs
    wandb_project: sear-p2e
    wandb_mode: online
    chunk_len: 5
    gamma: 0.99
    num_online_steps: 1000000
    num_seed_steps: 4000
    start_training: 5000
    max_episode_steps: 500
    max_episodes: 2000
    seq_len: 48
    batch_size: 256
    wm_batch: 16
    wm_every: 2
    wm_lr: 0.0001
    wm_compile: true
    use_world_model: true
    ensemble_k: 5
    ensemble_obs_slice:
    - 19
    - 37
    imagine_horizon: 5
    imagine_batch: 256
    critic_vmin: -260.0
    # headroom above 0 for the soft value (reward + alpha*entropy)
    critic_vmax: 60.0
    eval_receding: 5
    eval_episodes: 20
    eval_max_steps: 500
    eef_slice:
    - 12
    - 15
    # RLPD-style symmetric sampling: fraction of each training batch drawn
    # from reward-bearing episodes. FIXED from 0.5, which over-represented
    # a single early episode ~100x on every update when only one or two
    # reward episodes existed.
    reward_batch_frac: 0.15
    alpha_min: 0.001
    # --- Hindsight Experience Replay (Andrychowicz et al. 2017) ---
    use_her: True
    # fraction of training windows relabeled with a 'future' achieved goal
    # (paper's best strategy; 0.8 ~= their k=4 ratio)
    her_frac: 0.8
    # goal-success distance in meters (measured against this env)
    her_thresh: 0.04
    # reject a relabeled 'future' goal if the achieved state is ALREADY
    # within this many thresholds of it at the window start. Without this,
    # a cube that never moves makes every relabeled goal satisfied on
    # arrival, reward 0 everywhere, and q_max pinned at the ceiling.
    her_reject_satisfied: True
    # -0.5 for cube-single (reward is 0/-1, so anything above -1 is a
    # partial); -1.5 for cube-double (reward 0/-1/-2)
    success_reward_thresh: -0.5
    log_every: 500
    eval_every: 10000
    save_every: 50000
