# One config for every arm. Each train_sac_chunked_*.py reads `defaults`,
# then any preset named with --configs (e.g. `--configs toy`), then dotted
# CLI overrides such as --chunk.select_n=16 or --general.run_name=foo.
#
# The QC-FQL block (`chunk`) and the latent-model block (`tdmpc`) are SHARED
# by every arm by construction -- there is one copy, so no arm can drift
# from another. An arm's own knobs live in its own block (ranking / mve /
# explore / optimistic) and are the ONLY thing that differs between it and
# its comparison partner.

defaults:

  seed: 0

  general:
    env_name: cube-triple-play-singletask-v0
    run_name: ''
    out_dir: runs/default
    wandb_project: beat-qc-fql
    wandb_mode: online          # 'disabled' skips wandb entirely
    # Latent-model checkpoint to load (model arms only). '' = train from
    # scratch alongside the policy.
    model_ckpt: ''
    seed_from_offline: True
    # QC main.py protocol: offline gradient updates on the static dataset,
    # then online interaction. Every number in the QC paper uses this.
    num_offline_steps: 250000
    num_online_steps: 1000000
    num_seed_steps: 4000        # random actions, only when there is no offline data
    start_training: 5000        # main.py `if i >= FLAGS.start_training`
    log_every: 100
    save_every: 10000
    eval_every: 10000
    eval_episodes: 20
    # Only read when env_name is toy-point-push.
    toy_offline_episodes: 300

  # ---------------------------------------------------------------------
  # QC-FQL, ported from github.com/ColinQiyangLi/qc (agents/acfql.py,
  # actor_type=distill-ddpg). Shared by EVERY arm.
  #
  # VALUES TAKEN FROM THE REFERENCE, don't re-litigate:
  #   hidden_dim 512 / num_layers 4   actor_hidden_dims = value_hidden_dims
  #   ensemble 2                      num_qs for FQL-based agents
  #   q_agg mean                      never min, for any agent in the repo
  #   alpha 300                       Table 4, cube-double (100 for triple
  #                                   and quadruple, 10000 for robomimic)
  #   flow_steps 10, lr 3e-4, tau 0.005, batch_size 256, utd_ratio 1
  #   chunk_len 5                     the paper's default
  #
  # No gradient clipping and no (1 + alpha) divisor in the actor loss. Rewards
  # are fed through RAW, as QC does with its {-n..0} rewards; a reward shift
  # would turn "one cube placed" into a sustained +1/step on multi-cube tasks.
  # ---------------------------------------------------------------------
  chunk:
    chunk_len: 5
    # Candidate chunks per decision, in every arm that selects. QC's own
    # best-of-N analysis bounds the KL from the sampling policy by
    # log N - (N-1)/N; the paper used N=32 on cube-*. 1 = plain QC-FQL.
    select_n: 16
    utd_ratio: 1
    batch_size: 256
    # Floor only -- raised at runtime to max(., offline_size + online + 1)
    # so offline data is never evicted (main.py's max(buffer_size, size+1)).
    replay_capacity: 1000000
    gamma: 0.99
    lr: 3e-4
    hidden_dim: 512
    num_layers: 4
    critic_target_tau: 0.005
    ensemble: 2
    q_agg: mean
    alpha: 300.0
    flow_steps: 10
    # Observation slice holding the end-effector xyz, for eval/coherence.
    # Measured on cube-single and cube-double.
    eef_slice: [12, 15]
    # torch.compile on the actor/critic: the per-step cost is ~400 tiny
    # kernel launches, so fusing them is the lever. A minute or two at
    # startup; pure speed change, alters no results.
    compile_nets: True

  # ---------------------------------------------------------------------
  # TD-MPC2 latent model (nicklashansen/tdmpc2, state variant). Shared by
  # every model arm. Encoder -> latent, dynamics in latent, reward head and
  # Q both read the latent. Nothing decodes to observation space.
  # ---------------------------------------------------------------------
  tdmpc:
    # Env steps per model update. No counterpart in QC, so a free choice;
    # the offline phase costs no env steps, so this is cheap where it counts.
    train_every: 2
    batch_size: 256
    # Latent rollout length per update. 5 = chunk_len, so the model is
    # trained on exactly the depth a single-chunk scorer consumes (TD-MPC2's
    # own default is 3). Raise with rollout_chunks if scoring deeper.
    horizon: 5

    # --- architecture, TD-MPC2 defaults for state observations
    latent_dim: 512
    mlp_dim: 512
    # Encoder hidden width (TD-MPC2 enc_dim): enc_layers-1 hidden layers of
    # this width, then the latent. Narrower than the heads, as in the ref.
    enc_dim: 256
    enc_layers: 2
    # SimNorm group size. The latent is softmaxed in groups of this many,
    # which keeps it bounded WITHOUT a reconstruction loss -- the reason this
    # model needs no decoder. Each group is also a categorical distribution,
    # which the optimistic arm's loss reads literally.
    simnorm_dim: 8
    num_q: 5
    dropout: 0.01
    # Dynamics heads. 1 = TD-MPC2. The explore arm sets its own value.
    num_dyn: 1

    # --- symlog two-hot for BOTH reward and value, matching the Dreamer
    # config this replaced. Both terms of a chunk score come out in raw
    # units, so pooled imagined reward and terminal Q are directly addable
    # and comparable to the QC critic's own Q.
    num_bins: 101
    vmin: -10.0
    vmax: 10.0

    # --- optimization, TD-MPC2 defaults
    lr: 3e-4
    enc_lr_scale: 0.3
    tau: 0.01
    rho: 0.5
    consistency_coef: 20.0
    reward_coef: 0.1
    value_coef: 0.1
    entropy_coef: 1e-4
    grad_clip_norm: 20.0

    # --- accuracy checks at every eval (tdmpc/diagnostics.py). Offline
    # against replay windows that contain an above-baseline reward, ZERO env
    # steps. 0 disables. depth is in chunks; 1 = what a single-chunk scorer
    # consumes.
    diag_windows: 256
    diag_depth: 1

    # torch.compile on the latent model's update and scoring paths -- the
    # same launch-bound situation as chunk.compile_nets, ~12k tiny kernels
    # per update. Pure speed change, alters no results.
    compile_nets: True

  # ---------------------------------------------------------------------
  # Per-arm knobs. Each arm differs from its comparison partner ONLY in
  # its own block.
  # ---------------------------------------------------------------------

  # train_sac_chunked_ranking.py  (partner: train_sac_chunked.py)
  ranking:
    # Chunks imagined per candidate. 1 = the candidate only, then the latent
    # Q. More = continue with the policy prior's actions at the imagined
    # latent -- no decode, so depth costs dynamics error (wm/latent_drift),
    # never decoder error.
    rollout_chunks: 1

  # train_sac_chunked_mve.py  (partner: train_sac_chunked.py)
  mve:
    # Chunks of latent expansion after the real chunk. 1 = the QC actor's
    # own next chunk through the model, then the latent Q. 0 = latent Q at
    # s' with no rollout. More = continue with the policy prior.
    chunks: 1
    # Blend: target bootstrap = (1-w) * Q_qc(s', a') + w * V_mve(s').
    # 0 recovers QC exactly; 1 is pure MVE. Start in the middle -- the
    # model's value is trained on single-step TD and is noisier early.
    weight: 0.5

  # train_sac_chunked_explore.py  (partner: train_sac_chunked.py)
  explore:
    rollout_chunks: 1
    # Dynamics heads for the disagreement bonus (Pathak et al. use 5).
    num_dyn: 5
    # Bonus = beta * (critic ensemble std of the candidate) * novelty[0,1].
    # Dimensionless: beta 1.0 means novelty may move a pick by at most one
    # critic-std. 0 = exactly the control. Vanishes as the critic's heads
    # converge, so there is nothing to schedule.
    beta: 1.0
    # What "novelty" means:
    #   model   dynamics-ensemble disagreement, mean over latent dims
    #   reward  same disagreement, weighted by |d reward_head / d z| -- only
    #           dims the reward head reads count (object-centric, no decoder)
    #   none    nu = 1 everywhere: the critic's doubt explores alone, no model
    #           in the pick. ATTRIBUTION arm.
    novelty: model
    # Where along the imagined chunk novelty is measured: path = mean over
    # the steps (motion), end = final imagined latent only (outcome).
    novelty_at: path
    # Ceiling on nu. bonus <= beta * s_i * nu_cap. 1 = the tested setting;
    # 3 lets the model keep ranking candidates that are all past 2x.
    nu_cap: 1.0

  # train_sac_chunked_optimistic.py  (partner: train_sac_chunked_ranking.py)
  optimistic:
    rollout_chunks: 1
    # Paper's O-DreamerV3 values. alpha 0.1 collapses learning there;
    # keep it tiny.
    alpha: 1.0e-4
    eta: 3.0e-6
    # lambda-return mixing for the advantage, and how many real starts per
    # update are rolled with the prior for `horizon` imagined steps.
    lam: 0.95
    imag_batch: 64
    horizon: 5
    # How far the imagined next latent moves from the model's prediction
    # toward the sampled one-hot class per group. 0 = deterministic rollout
    # (no RBMLE gradient); 1 = pure one-hot draw, which the reward/value
    # heads never see in training and extrapolate badly on. 0.5 keeps the
    # rollout inside each simplex while still depending on the draw.
    sample_mix: 0.5

# =======================================================================
# Presets. Layer on top of defaults with --configs NAME. They may only
# override keys that exist above.
# =======================================================================

# Fast CPU sanity run on the toy pusher (toy/point_push.py). Small nets,
# short phases, no wandb. Enough to see whether an arm beats the control
# in minutes -- NOT a substitute for cube runs.
toy:
  general:
    env_name: toy-point-push
    out_dir: runs/toy
    wandb_mode: disabled
    num_offline_steps: 6000
    num_online_steps: 10000
    start_training: 500
    log_every: 200
    save_every: 100000
    eval_every: 2000
    eval_episodes: 20
    toy_offline_episodes: 300
  chunk:
    hidden_dim: 256
    num_layers: 3
    alpha: 30.0
    eef_slice: [0, 2]
    compile_nets: False
    replay_capacity: 100000
  tdmpc:
    latent_dim: 64
    mlp_dim: 128
    enc_dim: 64
    num_q: 3
    batch_size: 128
    diag_windows: 128
    compile_nets: False
  optimistic:
    imag_batch: 32
