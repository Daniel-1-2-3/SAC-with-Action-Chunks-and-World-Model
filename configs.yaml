defaults:

  seed: 0
  batch_size: 32
  batch_length: 64

  jax:
    platform: cuda
    compute_dtype: float32
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    # Skip embodied's eager compile of train/report at agent construction.
    # Needed on pods whose XLA can't fresh-compile the train fn (RTX PRO
    # 4500: 'Too small divisible part of the contracting dimension');
    # functions then compile lazily on first use instead.
    precompile: False
    debug: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 1e-4, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 512, hidden: 512, stoch: 32, classes: 16, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 512, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 512, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 2, units: 512, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 2, units: 512, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

  train_sac_wm:

    general:
      env_name: cube-single-play-singletask-v0
      wm_ckpt: ''
      seed_from_offline: True
      num_seed_steps: 4000
      num_train_steps: 500000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 10
      out_dir: train_sac_wm_out
      wandb_project: world-model-sac
      wandb_mode: online

    dreamer:
      train_every: 1
      max_episodes: 2000

    sac:
      train_every: 5
      horizon: 15
      imagination_batch: 1024
      gamma: 0.99
      lam: 0.95
      reward_shift: 1.0
      lr: 3e-4
      feature_dim: 512
      hidden_dim: 256
      critic_target_tau: 0.005
      init_ent_coef: 1.0

  # Baseline arm. Keep every value below that also appears under
  # train_sac_wm.sac IDENTICAL to it -- gamma, reward_shift, lr, feature_dim,
  # hidden_dim, critic_target_tau, init_ent_coef are shared by design and the
  # comparison stops being controlled the moment one side is tuned alone.
  # train_every and batch_size are the exceptions: those are legitimately
  # method-specific and sit here at their standard SAC values.
  train_sac:

    general:
      env_name: cube-single-play-singletask-v0
      seed_from_offline: True
      num_seed_steps: 4000
      num_train_steps: 500000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 10
      out_dir: train_sac_out
      wandb_project: world-model-sac
      wandb_mode: online

    sac:
      train_every: 1
      batch_size: 256
      replay_capacity: 1000000
      gamma: 0.99
      reward_shift: 1.0
      lr: 3e-4
      feature_dim: 512
      hidden_dim: 256
      critic_target_tau: 0.005
      init_ent_coef: 1.0
  # ---------------------------------------------------------------------
  # Action-chunked arms: QC-FQL, ported from github.com/ColinQiyangLi/qc
  # (agents/acfql.py, actor_type=distill-ddpg). Every key that appears in
  # BOTH train_sac_chunked_wm.chunk and train_sac_chunked.chunk must hold the
  # same value -- the policy is the controlled variable and the only thing
  # allowed to differ between arms is whether a world model exists.
  # train_every, batch_size, imagination_batch and bc_batch are the
  # exceptions, since the arms genuinely draw their training data differently.
  #
  # VALUES TAKEN FROM THE REFERENCE, don't re-litigate:
  #   hidden_dim 512 / num_layers 4   actor_hidden_dims = value_hidden_dims
  #                                   = (512, 512, 512, 512)
  #   ensemble 2                      num_qs for FQL-based agents
  #   q_agg mean                      never min, for any agent in the repo
  #   alpha 300                       Table 4, cube-double (100 for triple
  #                                   and quadruple, 10000 for robomimic)
  #   flow_steps 10, lr 3e-4, tau 0.005, batch_size 256, utd_ratio 1
  #   chunk_len 5                     h=10 scored higher on cube-triple in the
  #                                   h ablation; 5 is the paper's default
  #                                   because it is cheaper
  #
  # There is no gradient clipping and no (1 + alpha) divisor in the actor
  # loss. Those two were cancelling each other; the reference has neither.
  #
  # reward_shift is 0.0 -- QC feeds raw {-n..0} rewards straight through. The
  # shift was a local addition and is what made alpha untransferable between
  # cube-single and cube-double, since it turns "one cube placed" into a
  # sustained +1/step on multi-cube tasks and inflates Q by ~65x.
  #
  # eef_slice [12,15] measured on both cube-single and cube-double.
  # ---------------------------------------------------------------------

  train_sac_chunked_wm:
    # ONE config for THREE isolated method trainers sharing this repo. Each
    # trainer reads only its own knobs, and each has a knob value that
    # reduces it to a control run:
    #
    #   train_wm_mve.py     LATENT MVE: critic/actor/acting on RSSM features
    #                       (the original architecture, isolated -- no
    #                       decoder anywhere). Target replaces Q(L_next) with
    #                       [R_1 + g*c_1*[... + g*c_N*Q(L_N)]] imagined in
    #                       latent space. Knobs: num_chunks (0 = QC-FQL on
    #                       latents, the REPRESENTATION control), mve_lambda,
    #                       and dreamer.online_train_every (WM freeze).
    #   train_wm_select.py  Model-scored best-of-N chunk selection at act
    #                       time; training untouched, raw observations.
    #                       Knobs: select_n (1 = exact QC-FQL control).
    #   train_wm_explore.py Disagreement exploration bonus: collection-time
    #                       chunk choice by Q + beta * z(model disagreement);
    #                       training untouched, raw observations; eval is the
    #                       bare policy. Knobs: explore_n (1 = exact QC-FQL),
    #                       explore_beta (0 = critic best-of-N, QC's own
    #                       method), explore_draws.
    #
    # Each trainer writes to out_dir/<method>/ so simultaneous runs on one
    # pod cannot clobber each other's checkpoints or eval CSVs.
    #
    # Measured context these designs answer to (Aug 26): decoded-state
    # bootstraps flatlined while the latent bootstrap learned; 5-step
    # imagined reward carries no signal at typical states (pick-place >> 5
    # steps); the reward head is accurate wherever reward varies; online
    # successes, not value accuracy, are the binding bottleneck.

    general:
      env_name: cube-triple-play-singletask-v0
      wm_ckpt: ''
      seed_from_offline: True
      num_offline_steps: 250000
      num_online_steps: 1000000
      num_seed_steps: 4000
      start_training: 5000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 20
      out_dir: train_sac_chunked_wm_out
      wandb_project: world-model-chunk
      wandb_mode: online

    dreamer:
      # The world model has no counterpart in QC, so this cadence is a free
      # choice. 10 is near standard Dreamer practice; 1 is ~5x slower for
      # little gain (batch_size * batch_length = 2048 frames per update).
      # 2, not 10 -- the world model gets 5x the updates per env step. It is
      # the component every model-based variant depends on, and the offline
      # phase costs no env steps, so this is cheap where it matters.
      train_every: 2
      # LATENT-MVE ONLY: WM update period during the ONLINE phase. 0 =
      # frozen for the whole online phase.
      online_train_every: 2
      # LATENT-MVE ONLY: absolute TOTAL step (offline + online) after which
      # the WM stops training entirely; 0 = never freeze. 500k = 250k offline
      # + 250k online experience, then frozen: representation drift is
      # confined to the early online phase (weakest policy, least-converged
      # critic) and the 500k+ window -- where qc-fql's success climb happens
      # -- runs on a stationary representation. The original run trained the
      # WM forever; its 3-8x critic loss was the suspected cost. Watch
      # wm/reward_corr after the freeze: decay there means the frozen model
      # is falling behind the policy's new states -- push this later.
      wm_freeze_after: 500000
      max_episodes: 2000

    chunk:
      chunk_len: 5
      # --- train_wm_mve.py (latent) ---
      # Imagined chunks appended to the target, in latent space. Bootstrap
      # moves from chunk_len to chunk_len * (num_chunks + 1) env steps:
      # 10 -> 55, long enough to span a grasp-move-place, which the Aug 26
      # autopsy showed is the only horizon where imagined reward carries
      # signal the 1-chunk target lacks (5-step futures are all floor).
      # Costs: num_chunks sequential dispatches per update, and dynamics
      # error compounding over 50 imagined steps -- wm_report runs at this
      # depth, so wm/reward_corr_chunk10 gauges the latter every eval; drop
      # mve_lambda below 1.0 if it degrades with depth.
      # 0 disables imagination -> QC-FQL on latent features: the
      # REPRESENTATION control (not the no-world-model arm).
      num_chunks: 10
      # 1.0 = the nested target above: the ONLY bootstrap is Q at the deepest
      # imagined state. Below 1.0 blends the shallower imagined bootstraps
      # in, capping how far a model that degrades with depth can drag the
      # target. At depth 10 this is the first knob to reach for (try 0.95)
      # if wm/reward_corr_chunk10 sags or single-draw error grows.
      mve_lambda: 1.0
      # 'q' = latent MVE as above (bootstrap = Q at the deepest imagined
      # latent). 'none' = PURE-WM ablation: the critic appears nowhere in
      # the target, which becomes a truncated 55-step imagined return.
      # Attribution run for whether the bootstrap is load-bearing; expected
      # to underperform (the horizon truncation biases targets toward ~-130
      # vs Q's ~-280 scale). Requires num_chunks > 0. Ignores mve_lambda.
      mve_bootstrap: q
      # --- train_wm_select.py ---
      # Candidate chunks sampled and model-scored per decision. QC's
      # best-of-N analysis bounds the KL from the sampling policy by
      # log N - (N-1)/N; the paper used N=32 on cube-*. 1 disables the
      # selector -> exact QC-FQL (the control).
      select_n: 16
      # --- train_wm_explore.py ---
      # Candidate chunks sampled per COLLECTION decision. 1 -> exact QC-FQL.
      explore_n: 16
      # Bonus weight in Q-units on the z-normalized disagreement. 0 -> pure
      # critic best-of-N (the QC paper's own method; the bonus's control).
      # explore/pick_changed and explore/q_paid show what beta is buying.
      explore_beta: 3.0
      # Stochastic rollouts per candidate for the disagreement estimate.
      # Cost scales linearly; 2 is the minimum for a std.
      explore_draws: 4
      # Linear decay of the bonus: full beta until decay_start (TOTAL steps,
      # offline included), 0 at decay_end, exploration hands collection back
      # to exploitation in between. decay_end 0 = constant beta forever (the
      # first run's behavior). Needed because the z-normalized bonus can't
      # anneal itself: something is always relatively most novel, so
      # pick_changed stays pinned high no matter how mature the model is.
      # 500k start = after the success-finding phase demonstrably began
      # (~350k in run 1); 900k end = before the reference's steep phase.
      explore_beta_decay_start: 500000
      explore_beta_decay_end: 900000
      # v2 novelty source. 'draws' = the original std-over-stochastic-rollouts
      # disagreement (floored by the RSSM's own sampling, cannot anneal).
      # 'rnd' = Random Network Distillation error at each candidate's imagined
      # END state: one rollout per candidate, deterministic score, and the
      # error decays wherever the policy has actually been -- the bonus
      # self-anneals per state with no schedule. The decay_start/end knobs
      # above are unused in either mode (never wired into this trainer).
      explore_novelty: rnd
      # Freeze the bonus's Welford normalizer after this many scored values
      # (16 per decision; 4000 ~= 250 decisions ~= 1250 env steps). A
      # tracking normalizer re-inflates a decaying signal and cancels the
      # anneal; freezing pins beta to an early-training scale so decayed
      # RND error means a genuinely small bonus. 0 = never freeze (v1).
      explore_norm_freeze: 4000
      rnd_hidden: 256
      rnd_out: 128
      rnd_lr: 1e-4
      rnd_buffer: 2048
      rnd_batch: 256
      # Train the predictor every this many env steps (one minibatch from
      # the visited-feature ring buffer).
      rnd_train_every: 4
      # v2 self-imitation BC: this fraction of the actor's flow-matching
      # batch comes from the top pooled-reward chunk windows of reward-
      # bearing episodes (see sample_reward_batch). Keeps the behavior flow
      # -- and with it the 16 candidates -- tracking the policy's best
      # behavior instead of the buffer average. 0 = v1 behavior. Critic and
      # world-model batches stay uniform regardless.
      sil_frac: 0.5
      # Reward level that counts as reward-bearing for the SIL batch. On
      # cube-double the floor step reward is -2 and one placed cube is -1,
      # so -1.5 catches partial progress; full successes only would be -0.5.
      sil_reward_thresh: -1.5
      # Real chunk transitions per critic/actor update -- QC's batch_size.
      batch_size: 256
      bc_batch: 256
      train_every: 1
      gamma: 0.99
      reward_shift: 0.0
      lr: 3e-4
      hidden_dim: 512
      num_layers: 4
      critic_target_tau: 0.005
      ensemble: 2
      q_agg: mean
      # v2 from-scratch deviation from the reference table's 300 (Table 4,
      # cube-double, tuned for demo-anchored offline-to-online). With no
      # dataset the anchor pins the actor to its own junk replay; 30 keeps
      # the flow trained (candidate diversity) while letting Q-gradients
      # actually move the actor. Restore 300 for any pretrained-data rerun.
      alpha: 30.0
      flow_steps: 10
      eef_slice: [12, 15]
      # --- world-model accuracy checks, run at every eval (wm_diagnostics.py)
      # These run OFFLINE against replay windows and spend ZERO env steps. The
      # windows are sampled with bias_start_to_reward so they are guaranteed to
      # contain reward variation -- without that every ground-truth reward is
      # identical and every correlation is undefined.
      # Replay windows measured per report. 0 disables.
      wm_diag_states: 256
      # Prior draws averaged per prediction. RSSM.imagine samples stoch every
      # step, so one draw understates accuracy. The single-draw error is
      # reported separately, since that is what Dyna actually consumes (one
      # draw per imagined transition).
      wm_diag_samples: 4
      # Rollout depth of the accuracy report. Dyna imagines exactly 1 chunk
      # per transition, so 1 measures exactly what it consumes.
      wm_diag_depth: 1
      # Reward level that counts as a hit for the report's biased sampling.
      # Matches dyna_seed_thresh: partial progress, not full success --
      # full-success windows barely exist in play data and the bias would
      # silently degrade to uniform (constant-reward, NaN correlations).
      wm_diag_reward_thresh: -2.5
      # torch.compile(mode='default') on the actor/critic. The per-step cost is
      # ~400 tiny kernel launches rather than arithmetic, so fusing them is the
      # lever. Costs a minute or two at startup; set False if it misbehaves --
      # it is a pure speed change and alters no results.
      compile_nets: True

  train_sac_chunked:

    general:
      env_name: cube-double-play-singletask-v0
      seed_from_offline: True
      num_offline_steps: 250000
      num_online_steps: 1000000
      num_seed_steps: 4000
      start_training: 5000 # see the note under train_sac_chunked_wm.general
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 20
      out_dir: train_sac_chunked_out
      wandb_project: world-model-chunk
      wandb_mode: online

    chunk:
      chunk_len: 5
      train_every: 1
      utd_ratio: 1
      batch_size: 256
      # Floor only -- train_sac_chunked.py raises this at runtime to
      # max(replay_capacity, offline_dataset_size + num_online_steps + 1),
      # matching main.py's `max(buffer_size, train_dataset.size + 1)`. A
      # fixed 1M would already be full from the offline seed alone on
      # cube-double, so the first online transition would evict offline data.
      replay_capacity: 1000000
      gamma: 0.99
      reward_shift: 0.0
      lr: 3e-4
      hidden_dim: 512
      num_layers: 4
      critic_target_tau: 0.005
      ensemble: 2
      q_agg: mean
      # v2 from-scratch deviation from the reference table's 300 (Table 4,
      # cube-double, tuned for demo-anchored offline-to-online). With no
      # dataset the anchor pins the actor to its own junk replay; 30 keeps
      # the flow trained (candidate diversity) while letting Q-gradients
      # actually move the actor. Restore 300 for any pretrained-data rerun.
      alpha: 30.0
      flow_steps: 10
      eef_slice: [12, 15]