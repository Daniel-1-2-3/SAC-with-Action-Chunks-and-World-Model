defaults:
  seed: 0
train_sear:
  train_sear:
    env_name: cube-double-play-singletask-v0
    out_dir: sear_runs
    wandb_project: sear-p2e
    wandb_mode: online
    chunk_len: 5
    gamma: 0.99
    num_online_steps: 1000000
    num_seed_steps: 4000
    start_training: 5000
    max_episode_steps: 500
    max_episodes: 2000
    seq_len: 48
    batch_size: 256
    wm_batch: 16
    wm_every: 2
    wm_lr: 0.0001
    wm_compile: true
    use_world_model: true
    ensemble_k: 5
    ensemble_obs_slice:
    - 19
    - 37
    imagine_horizon: 5
    explore_every: 2
    imagine_batch: 256
    critic_vmin: -260.0
    # headroom above 0 for the soft value (reward + alpha*entropy)
    critic_vmax: 60.0
    eval_receding: 5
    eval_episodes: 20
    eval_max_steps: 500
    eef_slice:
    - 12
    - 15
    # 0 = SEAR collects everything and no explorer is built; the world
    # model + reward head train passively on SEAR's data for eval-time
    # planning (plan_eval.py). >0 re-enables the P2E explorer.
    explore_frac: 0.0
    # RLPD-style symmetric sampling: half of each training batch from
    # reward-bearing episodes
    reward_batch_frac: 0.5
    alpha_min: 0.001
    # --- training-time initial-state curriculum (eval is never affected) ---
    # fraction of TRAINING episodes that start with object positions
    # resampled inside the env's own observed spawn box; some land in goal
    # zones, manufacturing reward-bearing starts with no task knowledge
    spawn_frac: 0.3
    # fraction that restart from a pooled simulator state snapshotted when
    # a better-than-floor reward was earned (Go-Explore style)
    reset_pool_frac: 0.25
    reset_pool_size: 2000
    # --- Hindsight Experience Replay (Andrychowicz et al. 2017) ---
    use_her: True
    # fraction of training windows relabeled with a 'future' achieved goal
    # (paper's best strategy; 0.8 ~= their k=4 ratio)
    her_frac: 0.8
    # goal-success distance in meters (measured against this env)
    her_thresh: 0.04
    explore_reward_mix: 0.3
    owm_alpha: 0.0
    owm_eta: 0.001
    success_reward_thresh: -1.5
    log_every: 500
    eval_every: 10000
    save_every: 50000
