# One config for every arm. Each train_*.py reads `defaults`, then dotted
# CLI overrides such as --chunk.select_n=16 or --general.run_name=foo.
#
# The QC-FQL block (`chunk`) and the latent-model block (`tdmpc`) are SHARED
# by every arm by construction -- there is one copy, so no arm can drift
# from another. An arm's own knobs live in its own block (`explore`) and are
# the ONLY thing that differs between it and its comparison partner.

defaults:

  seed: 0

  general:
    env_name: cube-triple-play-singletask-v0
    run_name: ''
    out_dir: runs/default
    wandb_project: beat-qc-fql
    wandb_mode: online          # 'disabled' skips wandb entirely
    # Latent-model checkpoint to load (explore arm only). '' = train from
    # scratch alongside the policy.
    model_ckpt: ''
    seed_from_offline: True
    # QC main.py protocol: offline gradient updates on the static dataset,
    # then online interaction. Every number in the QC paper uses this.
    num_offline_steps: 250000
    num_online_steps: 1000000
    num_seed_steps: 4000        # random actions, only when there is no offline data
    start_training: 5000        # main.py `if i >= FLAGS.start_training`
    log_every: 100
    save_every: 10000
    eval_every: 10000
    eval_episodes: 20

  # ---------------------------------------------------------------------
  # QC-FQL, ported from github.com/ColinQiyangLi/qc (agents/acfql.py,
  # actor_type=distill-ddpg). Shared by EVERY arm.
  #
  # VALUES TAKEN FROM THE REFERENCE, don't re-litigate:
  #   hidden_dim 512 / num_layers 4   actor_hidden_dims = value_hidden_dims
  #   ensemble 2                      num_qs for FQL-based agents
  #   q_agg mean                      never min, for any agent in the repo
  #   alpha 300                       Table 4, cube-double (100 for triple
  #                                   and quadruple, 10000 for robomimic)
  #   flow_steps 10, lr 3e-4, tau 0.005, batch_size 256, utd_ratio 1
  #   chunk_len 5                     the paper's default
  #
  # No gradient clipping and no (1 + alpha) divisor in the actor loss. Rewards
  # are fed through RAW, as QC does with its {-n..0} rewards; a reward shift
  # would turn "one cube placed" into a sustained +1/step on multi-cube tasks.
  # ---------------------------------------------------------------------
  chunk:
    chunk_len: 5
    # Candidate chunks per decision, drawn from the distilled one-step actor
    # and picked by the critic (train_qcfql_bon.py, train_explore.py). QC's
    # own best-of-N analysis bounds the KL from the sampling policy by
    # log N - (N-1)/N; the paper used N=32 on cube-*. 1 = plain QC-FQL.
    select_n: 16
    # Where the select_n candidates come from (train_qcfql_bon.py):
    #   actor  the distilled one-step actor, one pass per candidate (the
    #          earlier behaviour)
    #   bc     the flow BC policy: noise -> Euler with flow_steps -> clip,
    #          i.e. QC's own sampler, still picked by the critic.
    # Training is untouched either way; only what is drawn at a decision.
    candidate_source: actor
    # train_qc.py only: N flow-policy samples per decision for QC's own
    # best-of-N (act, eval and TD target). Their Table 4/5 value for
    # cube-*. QC ignores select_n and alpha.
    qc_num_samples: 32
    utd_ratio: 1
    batch_size: 256
    # Floor only -- raised at runtime to max(., offline_size + online + 1)
    # so offline data is never evicted (main.py's max(buffer_size, size+1)).
    replay_capacity: 1000000
    # Balanced replay sampling, EVERY arm: this fraction of each batch's
    # start indices (critic/actor chunks AND the model's windows) is drawn
    # from the online region of the buffer, the rest from the whole buffer.
    # 0.0 = QC's plain uniform sampling. With a 5M offline seed and ~150k
    # online transitions at 400k steps, uniform sampling shows the learners
    # ~3% online data, so two arms' different collections look the same to
    # them. Logged as replay/online_batch_frac.
    online_frac: 0.0
    gamma: 0.99
    lr: 3e-4
    hidden_dim: 512
    num_layers: 4
    critic_target_tau: 0.005
    ensemble: 2
    q_agg: mean
    alpha: 300.0
    flow_steps: 10
    # Observation slice holding the end-effector xyz, for eval/coherence.
    # Measured on cube-single and cube-double.
    eef_slice: [12, 15]
    # torch.compile on the actor/critic: the per-step cost is ~400 tiny
    # kernel launches, so fusing them is the lever. A minute or two at
    # startup; pure speed change, alters no results.
    compile_nets: True

  # ---------------------------------------------------------------------
  # TD-MPC2 latent model (nicklashansen/tdmpc2, state variant), trained by
  # the explore arm. Encoder -> latent, dynamics in latent, reward head and
  # Q both read the latent. Nothing decodes to observation space.
  # ---------------------------------------------------------------------
  tdmpc:
    # Env steps per model update. No counterpart in QC, so a free choice;
    # the offline phase costs no env steps, so this is cheap where it counts.
    train_every: 2
    batch_size: 256
    # Latent rollout length per update. 5 = chunk_len, so the model is
    # trained on exactly the depth a single-chunk novelty measure consumes
    # (TD-MPC2's own default is 3). Raise with rollout_chunks if imagining
    # deeper.
    horizon: 5

    # --- architecture, TD-MPC2 defaults for state observations
    latent_dim: 512
    mlp_dim: 512
    # Encoder hidden width (TD-MPC2 enc_dim): enc_layers-1 hidden layers of
    # this width, then the latent. Narrower than the heads, as in the ref.
    enc_dim: 256
    enc_layers: 2
    # SimNorm group size. The latent is softmaxed in groups of this many,
    # which keeps it bounded WITHOUT a reconstruction loss -- the reason this
    # model needs no decoder.
    simnorm_dim: 8
    num_q: 5
    dropout: 0.01
    # Dynamics heads. 1 = TD-MPC2. The explore arm sets its own value.
    num_dyn: 1
    # Balanced sampling for the MODEL's windows, independent of the
    # policy's chunk.online_frac (which stays at QC's uniform 0.0). This
    # fraction of every model batch starts in the online region, so the
    # model fits what the arm is visiting and disagreement there falls;
    # that fall is what turns "visited" into "not novel". 0.0 = same
    # uniform sampling as the policy (the earlier behaviour).
    online_frac: 0.5
    # The novelty reference (diagnosis/wm_data_disagreement), explore arm:
    #   step     one-step ensemble disagreement at the first real transition
    #            of each training window (earlier behaviour). A candidate is
    #            measured along an imagined path, whose disagreement
    #            compounds with depth, so the ratio was >1 almost everywhere
    #            and nu saturated.
    #   rollout  the same path measure a candidate gets (novelty_at,
    #            rollout_chunks), over the window's real actions. Like for
    #            like: a candidate the data would have taken scores ~1.
    ref_mode: rollout
    # explore.novelty=reward only: shrink the |d reward / d z| weights
    # toward uniform, w <- (1 - s) * w + s. 0 = raw weights (earlier
    # behaviour), 1 = plain mean. 0.5 keeps the reward head's emphasis
    # without letting a few dims' ensemble noise decide novelty.
    reward_weight_shrink: 0.5

    # --- symlog two-hot for BOTH reward and value, matching the Dreamer
    # config this replaced. Both come out in raw units, comparable to the
    # QC critic's own Q (tdmpc/diagnostics.py).
    num_bins: 101
    vmin: -10.0
    vmax: 10.0

    # --- optimization, TD-MPC2 defaults
    lr: 3e-4
    enc_lr_scale: 0.3
    tau: 0.01
    rho: 0.5
    consistency_coef: 20.0
    reward_coef: 0.1
    value_coef: 0.1
    entropy_coef: 1e-4
    grad_clip_norm: 20.0

    # --- accuracy checks at every eval (tdmpc/diagnostics.py). Offline
    # against replay windows that contain an above-baseline reward, ZERO env
    # steps. 0 disables. depth is in chunks; 1 = what a single-chunk novelty
    # measure consumes.
    diag_windows: 256
    diag_depth: 1

    # torch.compile on the latent model's update and rollout paths -- the
    # same launch-bound situation as chunk.compile_nets, ~12k tiny kernels
    # per update. Pure speed change, alters no results.
    compile_nets: True

  # ---------------------------------------------------------------------
  # Per-arm knobs. Each arm differs from its comparison partner ONLY in
  # its own block.
  # ---------------------------------------------------------------------

  # train_explore.py  (partner: train_qcfql_bon.py)
  explore:
    rollout_chunks: 1
    # Dynamics heads for the disagreement bonus (Pathak et al. use 5).
    num_dyn: 5
    # Bonus = beta * (critic ensemble std of the candidate) * novelty[0,1].
    # Dimensionless: beta 1.0 means novelty may move a pick by at most one
    # critic-std. 0 = exactly the control. Vanishes as the critic's heads
    # converge, so there is nothing to schedule.
    beta: 1.0
    # What "novelty" means:
    #   model   dynamics-ensemble disagreement, mean over latent dims
    #   reward  same disagreement, weighted by |d reward_head / d z| -- only
    #           dims the reward head reads count (object-centric, no decoder)
    #   none    nu = 1 everywhere: the critic's doubt explores alone, no model
    #           in the pick. ATTRIBUTION arm.
    novelty: model
    # Where along the imagined chunk novelty is measured: path = mean over
    # the steps (motion), end = final imagined latent only (outcome).
    novelty_at: path
    # Ceiling on nu. bonus <= beta * g * sigma_Q * nu_cap. 1 = the tested
    # setting (picked_novelty rarely exceeds 1.5 and is mostly under 1);
    # 3 lets the model keep ordering candidates that are all past 2x.
    nu_cap: 1.0
    # How the bonus is scaled:
    #   spread  beta * g * sigma_Q * s~_i * nu_i  (sigma_Q = critic spread
    #           across the candidates, s~_i = relative critic doubt in [0,1],
    #           g = learning-progress gate). Bounded by beta * g * sigma_Q *
    #           nu_cap, so beta is "how many critic spreads".
    #   unc     beta * s_i * nu_i, the earlier version, g ignored. Kept so
    #           existing runs stay reproducible.
    bonus_scale: spread
    # spread mode: multiply the bonus by the critic's relative doubt s~_i.
    # false = the bonus is beta * g * sigma_Q * nu_i. With a 2-head critic
    # s~_i is mostly noise and halves the bonus on random candidates; true
    # is the earlier behaviour.
    use_rel_unc: false
    # Learning-progress gate on the bonus (spread mode only). From the real
    # online episode returns: recent = last W, older = the W before; frac =
    # fraction of recent above median(older); g = 1 - 2 * max(frac - 0.5, 0),
    # EMA-smoothed with tau. Flat returns -> g = 1 (full exploration);
    # improving returns -> g -> 0 (the arm becomes the control). g = 1 for
    # the first 2W episodes. false -> g = 1 always.
    progress_gate: true
    progress_window: 20
    progress_tau: 0.2
    # What sets g (spread mode):
    #   gate    the learning-progress gate above, every decision.
    #   bandit  per EPISODE: at each real online episode start a
    #           sliding-window UCB over the last bandit_window finished
    #           episodes picks exploit (g = 0, the control) or explore
    #           (g = 1) by their returns, mean / range + c * sqrt(2 ln N / n).
    #           Logged as select/bandit_arm (fraction of episodes explored),
    #           bandit_n_window, bandit_mean_exploit, bandit_mean_explore,
    #           bandit_ucb_gap.
    controller: gate
    bandit_window: 20
    bandit_c: 1.0
