defaults:

  seed: 0
  # Replay sequence sampling: batch_size sequences of batch_length steps per
  # draw. Both the QC-FQL chunk sampler and the TD-MPC2 window sampler cut
  # their own training rows out of the same draw, so both arms see the same
  # data distribution.
  batch_size: 32
  batch_length: 64

  # ---------------------------------------------------------------------
  # Action-chunked arms: QC-FQL, ported from github.com/ColinQiyangLi/qc
  # (agents/acfql.py, actor_type=distill-ddpg). Every key that appears in
  # BOTH train_sac_chunked_wm.chunk and train_sac_chunked.chunk must hold the
  # same value -- the policy is the controlled variable and the only thing
  # allowed to differ between arms is whether a world model exists.
  # train_every and batch_size are the exceptions, since the arms genuinely
  # draw their training data differently.
  #
  # VALUES TAKEN FROM THE REFERENCE, don't re-litigate:
  #   hidden_dim 512 / num_layers 4   actor_hidden_dims = value_hidden_dims
  #                                   = (512, 512, 512, 512)
  #   ensemble 2                      num_qs for FQL-based agents
  #   q_agg mean                      never min, for any agent in the repo
  #   alpha 300                       Table 4, cube-double (100 for triple
  #                                   and quadruple, 10000 for robomimic)
  #   flow_steps 10, lr 3e-4, tau 0.005, batch_size 256, utd_ratio 1
  #   chunk_len 5                     h=10 scored higher on cube-triple in the
  #                                   h ablation; 5 is the paper's default
  #                                   because it is cheaper
  #
  # There is no gradient clipping and no (1 + alpha) divisor in the actor
  # loss. Those two were cancelling each other; the reference has neither.
  #
  # Rewards are fed through RAW, as QC does with its {-n..0} rewards. The
  # reward_shift that used to sit here was a local addition and is what made
  # alpha untransferable between cube-single and cube-double, since it turns
  # "one cube placed" into a sustained +1/step on multi-cube tasks and
  # inflates Q by ~65x. It is gone from both arms and from the scorer.
  #
  # eef_slice [12,15] measured on both cube-single and cube-double.
  # ---------------------------------------------------------------------

  train_sac_chunked_wm:
    # QC-FQL training + TD-MPC2-scored chunk selection at act time.
    #
    # TRAINING is plain QC-FQL on raw observations -- the target, critic,
    # actor and batch are identical to the critic-selection arm, and
    # _agent_update takes no model argument at all.
    #
    # The latent model is used in ONE place: at every chunk boundary the
    # ChunkSelector samples select_n candidate chunks from the one-step
    # policy, encodes the current observation once, imagines each candidate in
    # LATENT space, scores it as
    #
    #   sum_t gamma^t * r_model(z_t, a_t) + gamma^H * Q_model(z_H, pi(z_H))
    #
    # and executes the argmax. Nothing decodes back to observation space at
    # any point: the encoder produces a latent, the dynamics stay in it, and
    # the reward head and Q both read it directly. That removes the decoder
    # error the previous (Dreamer) scorer carried on every candidate, and the
    # latent policy prior lets the horizon extend without a decode.
    #
    # This targets the observed bottleneck directly: the previous runs never
    # found a single online success, and selection changes WHICH chunks get
    # executed, i.e. whether success data ever appears. It also degrades
    # gracefully -- if the scores are uninformative noise, the argmax over
    # i.i.d. policy samples is distributed like a single policy sample, so the
    # worst case is QC-FQL, not below it.
    #
    # select_n: 1 disables the selector entirely (select() is policy.act), so
    # the run reduces to QC-FQL exactly. That is the control.
    #
    # Execution stays at chunk_len. The selector chooses which chunk runs;
    # the open-loop commitment length is unchanged.

    general:
      env_name: cube-triple-play-singletask-v0
      run_name: ''
      model_ckpt: ''
      seed_from_offline: True
      num_offline_steps: 250000
      num_online_steps: 1000000
      num_seed_steps: 4000
      start_training: 5000
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 20
      out_dir: train_sac_chunked_wm_out
      wandb_project: beat-qc-fql
      wandb_mode: online

    tdmpc:
      # TD-MPC2 latent model (nicklashansen/tdmpc2, state-observation variant).
      # It has no counterpart in QC, so this cadence is a free choice. The
      # model gets an update every 2 env steps -- it is the component the
      # scorer depends on, and the offline phase costs no env steps, so this
      # is cheap where it matters.
      train_every: 2
      max_episodes: 2000
      # Rows per update, cut from the same replay draw QC-FQL uses.
      batch_size: 256
      # Latent rollout length per update. TD-MPC2's default. This is the
      # TRAINING horizon; the scoring horizon is chunk_len *
      # select_rollout_chunks and is independent of it.
      horizon: 3

      # --- architecture, TD-MPC2 defaults for state observations
      latent_dim: 512
      mlp_dim: 512
      enc_layers: 2
      # SimNorm group size. The latent is softmaxed in groups of this many,
      # which is what keeps it bounded WITHOUT a reconstruction loss -- the
      # reason this model needs no decoder at all.
      simnorm_dim: 8
      num_q: 5
      dropout: 0.01

      # --- symlog two-hot for BOTH reward and value, matching the Dreamer
      # config this replaces. Both terms of a chunk score come out in raw
      # units, so pooled imagined reward and the terminal Q are directly
      # addable and comparable to the QC critic's own Q.
      num_bins: 101
      vmin: -10.0
      vmax: 10.0

      # --- optimization, TD-MPC2 defaults
      lr: 3e-4
      # The encoder trains slower than the heads: every loss backs through it,
      # so full-speed updates make the reward and value targets non-stationary
      # for reasons unrelated to the data.
      enc_lr_scale: 0.3
      tau: 0.01
      # Per-step discount on the rollout losses.
      rho: 0.5
      consistency_coef: 20.0
      reward_coef: 0.1
      value_coef: 0.1
      entropy_coef: 1e-4
      grad_clip_norm: 20.0

      # --- accuracy checks, run at every eval (tdmpc/diagnostics.py)
      # OFFLINE against replay windows, ZERO env steps. Windows are sampled
      # with bias_start_to_reward so they are guaranteed to contain reward
      # variation -- without that every ground-truth reward is identical and
      # every correlation is undefined. 0 disables.
      diag_windows: 256
      # Rollout depth of the report, in CHUNKS. The selector only looks
      # select_rollout_chunks ahead, so 1 measures exactly what it consumes.
      # The model is deterministic (dynamics and the prior's mean action), so
      # unlike the RSSM there is no multi-draw averaging to configure.
      diag_depth: 1

    chunk:
      chunk_len: 5
      # Candidate chunks sampled and model-scored per decision. This is the
      # exploitation knob: QC's best-of-N analysis bounds the KL from the
      # sampling policy by log N - (N-1)/N, and the paper used N=32 on
      # cube-*. 16 halves the per-decision model cost; raise it if
      # select/score_std says the scores separate candidates cleanly.
      # 1 disables the selector -> exact QC-FQL (the control run).
      select_n: 16
      # Chunks imagined per candidate. 1 = imagine the candidate chunk only
      # (chunk_len latent steps), then the terminal latent Q. Raising it
      # continues the rollout with actions from the model's own policy prior
      # at the imagined latent -- pure latent steps, no decode, so unlike the
      # previous scorer depth does not compound decoder error. It does
      # compound DYNAMICS error, which wm/latent_drift measures.
      # Keep at 1 unless testing depth deliberately.
      select_rollout_chunks: 1
      # Real chunk transitions per critic/actor update -- QC's batch_size.
      batch_size: 256
      train_every: 1
      gamma: 0.99
      lr: 3e-4
      hidden_dim: 512
      num_layers: 4
      critic_target_tau: 0.005
      ensemble: 2
      q_agg: mean
      alpha: 300.0
      flow_steps: 10
      eef_slice: [12, 15]
      # torch.compile(mode='default') on the actor/critic. The per-step cost is
      # ~400 tiny kernel launches rather than arithmetic, so fusing them is the
      # lever. Costs a minute or two at startup; set False if it misbehaves --
      # it is a pure speed change and alters no results.
      compile_nets: True

  train_sac_chunked:

    general:
      env_name: cube-triple-play-singletask-v0
      run_name: ''
      seed_from_offline: True
      num_offline_steps: 250000
      num_online_steps: 1000000
      num_seed_steps: 4000
      start_training: 5000 # see the note under train_sac_chunked_wm.general
      log_every: 100
      save_every: 10000
      eval_every: 10000
      eval_episodes: 20
      out_dir: train_sac_chunked_out
      wandb_project: beat-qc-fql
      wandb_mode: online

    chunk:
      chunk_len: 5
      # Candidate chunks per decision, scored by the ONLINE CRITIC
      # Q(s, chunk) -- QC's own best-of-N. Same N as the model arm so the two
      # arms differ only in what does the scoring. 1 = plain QC-FQL.
      select_n: 16
      train_every: 1
      utd_ratio: 1
      batch_size: 256
      # Floor only -- train_sac_chunked.py raises this at runtime to
      # max(replay_capacity, offline_dataset_size + num_online_steps + 1),
      # matching main.py's `max(buffer_size, train_dataset.size + 1)`. A
      # fixed 1M would already be full from the offline seed alone on
      # cube-double, so the first online transition would evict offline data.
      replay_capacity: 1000000
      gamma: 0.99
      lr: 3e-4
      hidden_dim: 512
      num_layers: 4
      critic_target_tau: 0.005
      ensemble: 2
      q_agg: mean
      alpha: 300.0
      flow_steps: 10
      eef_slice: [12, 15]